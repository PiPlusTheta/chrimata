<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com" rel="preconnect" />
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..700;1,300..700&family=IBM+Plex+Mono:ital,wght@0,400;0,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;padding:0;background:#070C14;width:1920px;height:1080px;overflow:hidden;}
  #stage{position:relative;width:1920px;height:1080px;background:radial-gradient(ellipse at 50% 40%, #0d1522 0%, #070C14 62%);}
  .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(197,168,128,0.035) 1px, transparent 1px);background-size:3px 3px;}
  .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:1400px;}
  .logo{width:88px;height:88px;object-fit:contain;margin:0 auto 28px;display:block;}
  .tagline{font-family:'Hanken Grotesk',sans-serif;font-weight:300;font-size:30px;letter-spacing:0.01em;color:#CED4DA;}
  .wordmark{font-family:'Source Serif 4',serif;font-weight:400;font-size:96px;letter-spacing:0.06em;color:#F8F9FA;}
  .wordmark .accent{color:#C5A880;font-style:italic;font-weight:300;}
  .rule{width:64px;height:2px;background:#C5A880;margin:22px auto 0;transform-origin:center;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.28em;text-transform:uppercase;color:#8A7456;margin-top:26px;}
</style>
</head>
<body>
<div id="stage">
  <div class="grain"></div>
  <div class="center">
    <img class="logo" id="logo" src="logo.png" style="opacity:0" />
    <div class="tagline" id="tagline1" style="opacity:0">Every decision has a history.</div>
    <div class="wordmark" id="wordmark" style="opacity:0">CHRIMATA</div>
    <div class="rule" id="rule" style="opacity:0;transform:scaleX(0)"></div>
    <div class="eyebrow" id="eyebrow" style="opacity:0"></div>
  </div>
</div>
<script>
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function ramp(t,a,b){return clamp((t-a)/(b-a),0,1);}
  const mode = new URLSearchParams(location.search).get('mode') || 'open';
  const eyebrowText = "Veracity architecture for capital allocators.";
  window.seek = function(t){
    const logo = document.getElementById('logo');
    const tagline1 = document.getElementById('tagline1');
    const wordmark = document.getElementById('wordmark');
    const rule = document.getElementById('rule');
    const eyebrow = document.getElementById('eyebrow');
    if (mode === 'open') {
      logo.style.opacity = ramp(t,0.3,1.1);
      logo.style.transform = 'scale(' + (0.9 + 0.1*ramp(t,0.3,1.3)) + ')';
      tagline1.style.opacity = ramp(t,1.0,1.8) * (1-ramp(t,3.0,3.7));
      wordmark.style.opacity = ramp(t,3.1,4.0);
      wordmark.innerHTML = 'CHRIMATA';
      rule.style.opacity = ramp(t,3.6,4.2);
      rule.style.transform = 'scaleX(' + ramp(t,3.6,4.4) + ')';
      eyebrow.style.opacity = 0;
    } else {
      logo.style.opacity = ramp(t,0.2,1.0);
      wordmark.style.opacity = ramp(t,0.2,1.0);
      wordmark.innerHTML = 'CHRIMATA';
      rule.style.opacity = ramp(t,0.9,1.4);
      rule.style.transform = 'scaleX(' + ramp(t,0.9,1.6) + ')';
      eyebrow.textContent = eyebrowText;
      eyebrow.style.opacity = ramp(t,1.6,2.6);
      tagline1.style.opacity = 0;
    }
  };
  window.seek(0);
</script>
</body>
</html>
